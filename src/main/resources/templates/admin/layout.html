<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' — SiPangan Admin'">SiPangan Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
</head>

<!-- ===== SIDEBAR FRAGMENT ===== -->
<nav th:fragment="sidebar(active)" class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon">
            <span class="material-symbols-outlined" style="color:#fff;font-size:20px;">eco</span>
        </div>
        <div>
            <h2>SiPangan</h2>
            <div class="brand-sub">Digital Agriculture</div>
        </div>
    </div>

    <div class="sidebar-nav">
        <a th:href="@{/admin/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">
            <span class="material-symbols-outlined">dashboard</span> Dashboard
        </a>
        <a th:href="@{/admin/petani}" th:classappend="${active == 'petani'} ? 'active'">
            <span class="material-symbols-outlined">group</span> Data Petani
        </a>
        <a th:href="@{/admin/komoditas}" th:classappend="${active == 'komoditas'} ? 'active'">
            <span class="material-symbols-outlined">agriculture</span> Komoditas
        </a>
        <a th:href="@{/admin/stok}" th:classappend="${active == 'stok'} ? 'active'">
            <span class="material-symbols-outlined">inventory_2</span> Stok Pangan
        </a>
        <a th:href="@{/admin/distribusi}" th:classappend="${active == 'distribusi'} ? 'active'">
            <span class="material-symbols-outlined">local_shipping</span> Distribusi
        </a>
        <a th:href="@{/admin/chatbot}" th:classappend="${active == 'chatbot'} ? 'active'">
            <span class="material-symbols-outlined">smart_toy</span> Log Chatbot AI
        </a>
    </div>

    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="sidebar-nav" style="padding:0;">
                <span style="display:flex;align-items:center;gap:12px;padding:10px 14px;color:rgba(255,255,255,0.7);font-size:0.9375rem;">
                    <span class="material-symbols-outlined">logout</span> Keluar
                </span>
            </button>
        </form>
    </div>
</nav>

<!-- ===== TOPBAR FRAGMENT ===== -->
<header th:fragment="topbar(breadcrumb)" class="topbar">
    <div class="topbar-left">
        <button class="icon-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')" style="display:none;" id="menuToggle">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <div class="breadcrumb" th:utext="${breadcrumb}">Dashboard</div>
    </div>
    <div class="topbar-right">
        <button class="icon-btn">
            <span class="material-symbols-outlined">notifications</span>
        </button>
        <div class="avatar">A</div>
    </div>
</header>

<!-- ===== CENTERED POPUP FLASH MESSAGE ===== -->
<div th:fragment="flash">
    <div th:if="${successMessage}" class="flash-overlay" onclick="this.remove()">
        <div class="flash-popup flash-success">
            <span class="material-symbols-outlined" style="font-size:48px;color:#2e7d32;">check_circle</span>
            <h3 style="margin:12px 0 4px;font-size:1.25rem;">Berhasil!</h3>
            <p th:text="${successMessage}" style="color:var(--on-surface-variant);margin-bottom:16px;"></p>
            <button class="btn btn-primary btn-sm" onclick="this.closest('.flash-overlay').remove()">OK</button>
        </div>
    </div>
    <div th:if="${errorMessage}" class="flash-overlay" onclick="this.remove()">
        <div class="flash-popup flash-error">
            <span class="material-symbols-outlined" style="font-size:48px;color:#c62828;">error</span>
            <h3 style="margin:12px 0 4px;font-size:1.25rem;">Gagal!</h3>
            <p th:text="${errorMessage}" style="color:var(--on-surface-variant);margin-bottom:16px;"></p>
            <button class="btn btn-danger btn-sm" onclick="this.closest('.flash-overlay').remove()">OK</button>
        </div>
    </div>
</div>

<style th:fragment="flashStyle">
.flash-overlay {
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.4);z-index:9999;
    display:flex;align-items:center;justify-content:center;
    animation:fadeIn 0.3s ease;
}
.flash-popup {
    background:#fff;border-radius:16px;padding:32px 40px;
    text-align:center;min-width:320px;max-width:420px;
    box-shadow:0 16px 48px rgba(0,0,0,0.2);
    animation:popIn 0.3s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
</style>

</html>
