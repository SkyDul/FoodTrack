<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Distribusi')}"></head>
<body>
<div class="layout">
    <nav th:replace="~{admin/layout :: sidebar('distribusi')}"></nav>
    <div class="main-content">
        <header th:replace="~{admin/layout :: topbar('<a href=\'/admin/dashboard\'>Dashboard</a> &rsaquo; <span>Distribusi</span>')}"></header>
        <div class="page-content">
            <div th:replace="~{admin/layout :: flash}"></div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
                <h1 class="text-h2">Manajemen Distribusi</h1>
                <a th:href="@{/admin/distribusi/tambah}" class="btn btn-primary">
                    <span class="material-symbols-outlined">add</span> Tambah Distribusi
                </a>
            </div>

            <!-- Filter -->
            <div class="filter-bar">
                <div class="form-group">
                    <label class="text-label">Status</label>
                    <select class="form-control" id="filterStatus">
                        <option value="">Semua Status</option>
                        <option value="Menunggu">Menunggu</option>
                        <option value="Dikirim">Dikirim</option>
                        <option value="Selesai">Selesai</option>
                    </select>
                </div>
                <div class="form-group" style="flex:2;">
                    <label class="text-label">Cari</label>
                    <div class="input-icon">
                        <span class="material-symbols-outlined">search</span>
                        <input type="text" class="form-control" placeholder="Cari tujuan distribusi..." id="searchDist"/>
                    </div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-secondary btn-sm" onclick="resetDistFilter()">Reset</button>
                    <button class="btn btn-primary btn-sm" onclick="filterDist()">Filter</button>
                </div>
            </div>

            <div class="card">
                <div class="table-container">
                    <table id="distTable">
                        <thead>
                        <tr>
                            <th>No</th><th>Komoditas</th><th>Jumlah</th>
                            <th>Tujuan</th><th>Tanggal Kirim</th><th>Status</th>
                            <th>Update Status</th><th>Aksi</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="d, stat : ${listDistribusi}">
                            <td th:text="${stat.count}">1</td>
                            <td>
                                <strong th:text="${d.stokPangan.komoditas.namaKomoditas}" style="color:var(--on-surface);">Beras</strong><br/>
                                <span style="font-size: 0.8125rem; color: var(--on-surface-variant);">Petani: <span th:text="${d.stokPangan.petani.nama}">Budi</span></span>
                            </td>
                            <td>
                                <span class="badge badge-yellow">
                                    <span th:text="${d.stokPangan.jumlahMasuk}">200</span>
                                    <span th:text="${d.stokPangan.komoditas.satuan}">Kg</span>
                                </span>
                            </td>
                            <td th:text="${d.tujuan}">Gudang Kecamatan</td>
                            <td th:text="${d.tanggalKirim != null ? #temporals.format(d.tanggalKirim, 'dd MMM yyyy') : '—'}">14 Jan 2024</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${d.statusPengiriman == 'Selesai'} ? 'badge-green' : (${d.statusPengiriman == 'Dikirim'} ? 'badge-blue' : 'badge-yellow')">
                                    <span class="material-symbols-outlined" 
                                          th:text="${d.statusPengiriman == 'Selesai'} ? 'check_circle' : (${d.statusPengiriman == 'Dikirim'} ? 'local_shipping' : 'schedule')">schedule</span>
                                    <span th:text="${d.statusPengiriman}">Status</span>
                                </span>
                            </td>
                            <td style="text-align:center;">
                                <!-- Update Status Explicit Buttons -->
                                <form th:if="${d.statusPengiriman == 'Menunggu'}"
                                      th:action="@{/admin/distribusi/status/{id}(id=${d.idDistribusi})}" method="post" style="display:contents;"
                                      th:onsubmit="handleConfirm(event, 'Kirim barang ini sekarang?', 'confirm')">
                                    <button type="submit" class="btn btn-primary btn-sm" title="Kirim Barang">
                                        <span class="material-symbols-outlined" style="font-size:18px;">local_shipping</span> Kirim
                                    </button>
                                </form>
                                <form th:if="${d.statusPengiriman == 'Dikirim'}"
                                      th:action="@{/admin/distribusi/status/{id}(id=${d.idDistribusi})}" method="post" style="display:contents;"
                                      th:onsubmit="handleConfirm(event, 'Tandai distribusi ini telah selesai/sampai?', 'confirm')">
                                    <button type="submit" class="btn btn-primary btn-sm" style="background: var(--primary);" title="Tandai Selesai">
                                        <span class="material-symbols-outlined" style="font-size:18px;">check_circle</span> Selesai
                                    </button>
                                </form>
                                <span th:if="${d.statusPengiriman == 'Selesai'}" style="font-size:0.75rem;color:var(--primary);font-weight:600;">Tuntas</span>
                            </td>
                            <td style="text-align:center;">
                                <form th:action="@{/admin/distribusi/hapus/{id}(id=${d.idDistribusi})}" method="post" style="display:contents;"
                                      th:onsubmit="handleConfirm(event, 'Yakin ingin menghapus data distribusi ini?', 'delete')">
                                    <button type="submit" class="btn-icon delete" title="Hapus">
                                        <span class="material-symbols-outlined">delete</span>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listDistribusi)}">
                            <td colspan="8" style="text-align:center;color:var(--outline);padding:40px;">Belum ada data distribusi</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
function filterDist(){
    const s=document.getElementById('filterStatus').value.toLowerCase();
    const q=document.getElementById('searchDist').value.toLowerCase();
    document.querySelectorAll('#distTable tbody tr').forEach(r=>{
        const cells=r.querySelectorAll('td');
        if(cells.length<6)return;
        const status=cells[5].textContent.toLowerCase(), tujuan=cells[3].textContent.toLowerCase();
        r.style.display=(!s||status.includes(s))&&(!q||tujuan.includes(q))?'':'none';
    });
}
function resetDistFilter(){
    document.getElementById('filterStatus').value='';
    document.getElementById('searchDist').value='';
    document.querySelectorAll('#distTable tbody tr').forEach(r=>r.style.display='');
}
</script>
<div th:replace="~{admin/layout :: confirmModal}"></div>
</body>
</html>
