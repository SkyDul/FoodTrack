<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login Admin — SiPangan</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: #1a5c2a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 400px;
            padding: 32px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            justify-content: center;
        }
        .brand-icon {
            width: 40px; height: 40px;
            background: #096430;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1e293b;
            letter-spacing: -0.5px;
            margin: 0;
        }
        .brand-name span { color: #096430; }
        
        .form-header { text-align: center; margin-bottom: 24px; }
        .form-header h1 { font-size: 1.125rem; font-weight: 700; color: #1e293b; margin: 0; }
        
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .form-control {
            width: 100%;
            height: 44px;
            padding: 0 16px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            font-size: 0.9375rem;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: #1a5c2a;
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26, 92, 42, 0.12);
        }
        
        /* Remember & Forgot Password Row */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.8125rem;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            cursor: pointer;
        }
        .forgot-pwd {
            color: #1a5c2a;
            font-weight: 600;
            text-decoration: none;
        }
        .forgot-pwd:hover { text-decoration: underline; }

        .btn-login {
            width: 100%;
            height: 48px;
            background: #1a5c2a;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.9375rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-login:hover { background: #2e7d32; transform: translateY(-1px); }
        
        .footer-links {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
            text-align: center;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #64748b;
            text-decoration: none;
            font-size: 0.8125rem;
            font-weight: 500;
        }
        .back-link:hover { color: #1a5c2a; }
        
        .error-msg {
            background: #fef2f2;
            color: #dc2626;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8125rem;
            margin-bottom: 16px;
            text-align: center;
            border: 1px solid #fee2e2;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <span class="material-symbols-outlined" style="color:#ffb300; font-size:36px; font-variation-settings:'FILL' 1;">eco</span>
            <h1 class="brand-name" style="color:#1a5c2a; font-weight:800; font-size:1.75rem; letter-spacing:-0.5px; margin:0;">SiPangan</h1>
        </div>

        <div class="form-header">
            <h1>Login Admin</h1>
        </div>

        <div th:if="${param.errorMsg != null}" class="error-msg">
            <span th:text="${param.errorMsg}">Username atau password salah.</span>
        </div>
        <div th:if="${param.error != null and param.errorMsg == null}" class="error-msg">
            Username atau password salah.
        </div>

        <form th:action="@{/admin/login}" method="post">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="admin" required autofocus/>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div style="position:relative;">
                    <input type="password" name="password" id="adminPwd" class="form-control" placeholder="••••••••" required/>
                    <span class="material-symbols-outlined" onclick="togglePwd('adminPwd', this)" style="position:absolute; right:12px; top:12px; cursor:pointer; color:#64748b; font-size:20px;">visibility</span>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember-me"/> Ingat Saya
                </label>
            </div>

            <button type="submit" class="btn-login">Masuk Dashboard</button>
        </form>

        <div class="footer-links">
            <a th:href="@{/}" class="back-link">
                <span class="material-symbols-outlined" style="font-size:16px;">arrow_back</span>
                Kembali ke Beranda
            </a>
        </div>
    </div>
    <script>
        function togglePwd(id, icon) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const usernameInput = document.querySelector('input[name="username"]');
            const passwordInput = document.querySelector('input[name="password"]');
            const rememberCheckbox = document.querySelector('input[name="remember-me"]');
            
            if (localStorage.getItem('sipangan_admin_remember') === 'true') {
                usernameInput.value = localStorage.getItem('sipangan_admin_username') || '';
                passwordInput.value = localStorage.getItem('sipangan_admin_password') || '';
                rememberCheckbox.checked = true;
            }

            document.querySelector('form').addEventListener('submit', () => {
                if (rememberCheckbox.checked) {
                    localStorage.setItem('sipangan_admin_remember', 'true');
                    localStorage.setItem('sipangan_admin_username', usernameInput.value);
                    localStorage.setItem('sipangan_admin_password', passwordInput.value);
                } else {
                    localStorage.removeItem('sipangan_admin_remember');
                    localStorage.removeItem('sipangan_admin_username');
                    localStorage.removeItem('sipangan_admin_password');
                }
            });
        });
    </script>
</body>
</html>
