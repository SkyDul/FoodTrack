<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Form Komoditas')}"></head>
<body>
<div class="layout">
    <nav th:replace="~{admin/layout :: sidebar('komoditas')}"></nav>
    <div class="main-content">
        <header th:replace="~{admin/layout :: topbar('<a href=\'/admin/dashboard\'>Dashboard</a> &rsaquo; <a href=\'/admin/komoditas\'>Komoditas</a> &rsaquo; <span>Form</span>')}"></header>
        <div class="page-content">
            <div class="page-header">
                <h1 th:text="${komoditas.idKomoditas != null} ? 'Edit Komoditas' : 'Tambah Komoditas'">Tambah Komoditas</h1>
            </div>
            <div class="card" style="max-width:600px;">
                <form th:action="@{/admin/komoditas/simpan}" method="post" th:object="${komoditas}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" th:field="*{idKomoditas}"/>
                    <div class="form-group">
                        <label for="namaKomoditas">Nama Komoditas <span class="required">*</span></label>
                        <input type="text" id="namaKomoditas" th:field="*{namaKomoditas}" class="form-control"
                               th:classappend="${#fields.hasErrors('namaKomoditas')} ? 'is-invalid'"
                               placeholder="Contoh: Beras, Jagung, Kedelai" required/>
                        <div th:if="${#fields.hasErrors('namaKomoditas')}" class="invalid-feedback" th:errors="*{namaKomoditas}">Error</div>
                    </div>
                    <div class="form-group">
                        <label for="satuan">Satuan <span class="required">*</span></label>
                        <input type="text" id="satuan" th:field="*{satuan}" class="form-control"
                               th:classappend="${#fields.hasErrors('satuan')} ? 'is-invalid'"
                               placeholder="Contoh: Kg, Ton, Karung" required/>
                        <div th:if="${#fields.hasErrors('satuan')}" class="invalid-feedback" th:errors="*{satuan}">Error</div>
                    </div>
                    <div style="display:flex;gap:12px;justify-content:flex-end;padding-top:20px;border-top:1px solid var(--outline-variant);">
                        <a th:href="@{/admin/komoditas}" class="btn btn-secondary">Batal</a>
                        <button type="submit" class="btn btn-primary">
                            <span class="material-symbols-outlined" style="font-size:18px;">save</span> Simpan Data
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
