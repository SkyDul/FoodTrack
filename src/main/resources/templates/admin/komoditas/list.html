<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Komoditas')}"></head>
<body>
<div class="layout">
    <nav th:replace="~{admin/layout :: sidebar('komoditas')}"></nav>
    <div class="main-content">
        <header th:replace="~{admin/layout :: topbar('<a href=\'/admin/dashboard\'>Dashboard</a> &rsaquo; <span>Komoditas</span>')}"></header>
        <div class="page-content">
            <div th:replace="~{admin/layout :: flash}"></div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
                <h1 class="text-h2">Data Komoditas</h1>
                <a th:href="@{/admin/komoditas/tambah}" class="btn btn-primary">
                    <span class="material-symbols-outlined">add</span> Tambah Komoditas
                </a>
            </div>
            <div class="card">
                <div class="table-container">
                    <table>
                        <thead>
                        <tr><th>No</th><th>Nama Komoditas</th><th>Satuan</th><th>Aksi</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="k, stat : ${listKomoditas}">
                            <td th:text="${stat.count}">1</td>
                            <td style="display:flex; align-items:center; gap:12px;">
                                <div style="width:28px; height:28px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                                    <!-- Beras -->
                                    <img th:if="${k.namaKomoditas.toLowerCase().contains('beras') or k.namaKomoditas.toLowerCase().contains('padi')}" 
                                         src="https://img.icons8.com/color/96/grains-of-rice.png" alt="Beras" style="width:100%; height:100%; object-fit:contain;" />
                                    
                                    <!-- Jagung -->
                                    <img th:if="${k.namaKomoditas.toLowerCase().contains('jagung')}" 
                                         src="https://img.icons8.com/color/96/corn.png" alt="Jagung" style="width:100%; height:100%; object-fit:contain;" />
                                    
                                    <!-- Kedelai -->
                                    <img th:if="${k.namaKomoditas.toLowerCase().contains('kedelai')}" 
                                         src="https://img.icons8.com/color/96/soy.png" alt="Kedelai" style="width:100%; height:100%; object-fit:contain;" />
                                    
                                    <!-- Cabai -->
                                    <img th:if="${k.namaKomoditas.toLowerCase().contains('cabai')}" 
                                         src="https://img.icons8.com/color/96/chili-pepper--v1.png" alt="Cabai" style="width:100%; height:100%; object-fit:contain;" />
                                    
                                    <!-- Bawang -->
                                    <img th:if="${k.namaKomoditas.toLowerCase().contains('bawang')}" 
                                         src="https://img.icons8.com/color/96/onion.png" alt="Bawang" style="width:100%; height:100%; object-fit:contain;" />
                                    
                                    <!-- Tomat -->
                                    <img th:if="${k.namaKomoditas.toLowerCase().contains('tomat')}" 
                                         src="https://img.icons8.com/color/96/tomato.png" alt="Tomat" style="width:100%; height:100%; object-fit:contain;" />
                                    
                                    <!-- Telur -->
                                    <img th:if="${k.namaKomoditas.toLowerCase().contains('telur')}" 
                                         src="https://img.icons8.com/color/96/eggs.png" alt="Telur" style="width:100%; height:100%; object-fit:contain;" />
                                    
                                    <!-- Daging -->
                                    <img th:if="${k.namaKomoditas.toLowerCase().contains('daging')}" 
                                         src="https://img.icons8.com/color/96/steak.png" alt="Daging" style="width:100%; height:100%; object-fit:contain;" />
                                    
                                    <!-- Default -->
                                    <img th:if="${!k.namaKomoditas.toLowerCase().contains('beras') && !k.namaKomoditas.toLowerCase().contains('padi') && !k.namaKomoditas.toLowerCase().contains('jagung') && !k.namaKomoditas.toLowerCase().contains('kedelai') && !k.namaKomoditas.toLowerCase().contains('cabai') && !k.namaKomoditas.toLowerCase().contains('bawang') && !k.namaKomoditas.toLowerCase().contains('tomat') && !k.namaKomoditas.toLowerCase().contains('telur') && !k.namaKomoditas.toLowerCase().contains('daging')}" 
                                         th:src="@{/img/logo.png}" alt="FoodTrack" style="width:100%; height:100%; object-fit:contain;" />
                                </div>
                                <strong th:text="${k.namaKomoditas}">Beras</strong>
                            </td>
                            <td th:text="${k.satuan}">Kg</td>
                            <td style="display:flex;gap:4px;">
                                <a th:href="@{/admin/komoditas/edit/{id}(id=${k.idKomoditas})}" class="btn-icon edit" title="Edit">
                                    <span class="material-symbols-outlined">edit</span>
                                </a>
                                <form th:action="@{/admin/komoditas/hapus/{id}(id=${k.idKomoditas})}" method="post" style="display:inline;"
                                      th:onsubmit="handleConfirm(event, 'Yakin ingin menghapus komoditas ini?', 'delete')">
                                    <button type="submit" class="btn-icon delete" title="Hapus">
                                        <span class="material-symbols-outlined">delete</span>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listKomoditas)}">
                            <td colspan="4" style="text-align:center;color:var(--outline);padding:40px;">Belum ada data komoditas</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{admin/layout :: confirmModal}"></div>
</body>
</html>
