<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Pengaturan')}"></head>
<body>
<div class="layout">
    <nav th:replace="~{admin/layout :: sidebar('settings')}"></nav>
    <div class="main-content">
        <header th:replace="~{admin/layout :: topbar('<a href=\'/admin/dashboard\'>Dashboard</a> &rsaquo; <span>Pengaturan</span>')}"></header>
        <div class="page-content">
            <div th:replace="~{admin/layout :: flash}"></div>

            <div class="page-header">
                <h1>Pengaturan Sistem</h1>
                <p>Konfigurasi parameter global dan preferensi aplikasi.</p>
            </div>

            <div class="card" style="margin-top: 24px;">
                <div class="form-group">
                    <label>Nama Aplikasi</label>
                    <input type="text" class="form-control" value="SiPangan" readonly/>
                </div>
                <div class="form-group" style="margin-top:20px;">
                    <label>Mode Pemeliharaan</label>
                    <div style="display:flex; align-items:center; gap:12px;">
                        <input type="checkbox" id="maint" style="width:20px; height:20px;"/>
                        <label for="maint" style="margin:0; font-weight:400;">Aktifkan Mode Maintenance</label>
                    </div>
                </div>
                <div style="margin-top:32px; padding-top:24px; border-top:1px solid var(--outline-variant);">
                    <button class="btn btn-primary" onclick="alert('Pengaturan disimpan!')">Simpan Perubahan</button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
