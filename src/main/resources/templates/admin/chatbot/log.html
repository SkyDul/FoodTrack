<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Log Chatbot AI')}"></head>
    <style>
        /* Hide Date Spinners */
        input[type="date"]::-webkit-inner-spin-button,
        input[type="date"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="date"] {
            -moz-appearance: textfield;
        }
        
        .filter-section {
            background: var(--surface);
            border: 1px solid var(--outline-variant);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 32px;
            display: flex;
            align-items: flex-end;
            gap: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }
        .filter-group { flex: 1; }
        .filter-group label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--outline); text-transform: uppercase; margin-bottom: 8px; }
        
        .chat-log-item {
            background: var(--surface);
            border: 1px solid var(--outline-variant);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .chat-log-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.05);
            border-color: var(--primary);
        }
        .chat-bubble-user {
            background: var(--surface-container-low);
            border-radius: 0 16px 16px 16px;
            padding: 12px 16px;
            color: var(--on-surface);
            font-size: 0.9375rem;
            line-height: 1.5;
        }
        .chat-bubble-ai {
            background: var(--primary-container);
            color: var(--on-primary-container);
            border-radius: 16px 0 16px 16px;
            padding: 12px 16px;
            font-size: 0.9375rem;
            line-height: 1.5;
            border: 1px solid var(--outline-variant);
        }
        .ai-badge {
            background: var(--primary);
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
<div class="layout">
    <nav th:replace="~{admin/layout :: sidebar('chatbot')}"></nav>
    <div class="main-content">
        <header th:replace="~{admin/layout :: topbar('<a href=\'/admin/dashboard\' style=\'color:var(--primary);text-decoration:none;font-weight:500;\'>Dashboard</a> <span style=\'color:var(--outline);margin:0 4px;\'>&rsaquo;</span> <span style=\'font-weight:600;color:var(--on-surface);\'>Log Chatbot AI</span>')}"></header>
        <div class="page-content">
            <div th:replace="~{admin/layout :: flash}"></div>
            <div class="page-header" style="margin-bottom: 32px;">
                <h1 style="font-size: 1.75rem; font-weight: 900; letter-spacing: -0.5px;">Monitoring Asisten AI</h1>
                <p style="color: var(--outline);">Audit riwayat konsultasi petani dengan mesin kecerdasan buatan Gemini.</p>
            </div>

            <!-- Enhanced Filter -->
            <div class="filter-section">
                <div class="filter-group">
                    <label>Filter Nama Petani</label>
                    <select class="form-control" id="filterPetani" style="height: 48px; border-radius: 12px;">
                        <option value="">Semua Petani</option>
                        <option th:each="p : ${listPetani}" th:value="${p.nama}" th:text="${p.nama}">Budi</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Berdasarkan Tanggal</label>
                    <input type="date" class="form-control" id="filterDate" style="height: 48px; border-radius: 12px;"/>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-primary" onclick="filterLog()" style="height: 48px; padding: 0 24px; border-radius: 12px; font-weight: 700;">
                        <span class="material-symbols-outlined" style="font-size: 20px;">filter_alt</span>
                    </button>
                    <button class="btn btn-secondary" onclick="resetLogFilter()" style="height: 48px; padding: 0 16px; border-radius: 12px;">
                        <span class="material-symbols-outlined" style="font-size: 20px;">restart_alt</span>
                    </button>
                </div>
            </div>

            <!-- Chat Log Cards -->
            <div id="logContainer">
                <div th:each="log : ${listChatbotLog}" class="chat-log-item">
                    <!-- User Message -->
                    <div style="display:flex; gap:16px; align-items:flex-start;">
                        <div style="width:40px;height:40px;border-radius:12px;background:var(--primary-container);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--primary);flex-shrink:0;">
                            <span th:text="${log.petani.nama != null && !log.petani.nama.isEmpty() ? log.petani.nama.substring(0,1).toUpperCase() : 'P'}">P</span>
                        </div>
                        <div style="flex:1;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                                <strong th:text="${log.petani.nama}" data-petani style="font-weight:700; color:var(--on-surface);">Budi Santoso</strong>
                                <span th:text="${#temporals.format(log.timestamp, 'dd MMM, HH:mm')}" 
                                      th:data-date-iso="${#temporals.format(log.timestamp, 'yyyy-MM-dd')}"
                                      style="font-size:0.75rem; color:var(--outline); font-weight:600;">12 Jan, 14:32</span>
                            </div>
                            <div class="chat-bubble-user">
                                <span th:text="${log.userPrompt}">Pertanyaan petani...</span>
                            </div>
                        </div>
                    </div>

                    <!-- AI Response -->
                    <div style="display:flex; gap:16px; align-items:flex-start; justify-content: flex-end;">
                        <div style="flex:1; display: flex; flex-direction: column; align-items: flex-end;">
                            <div style="margin-bottom:8px;">
                                <span class="ai-badge">FoodTrack AI</span>
                            </div>
                            <div class="chat-bubble-ai">
                                <p th:text="${log.geminiResponse}" style="margin:0;">Respons AI...</p>
                            </div>
                        </div>
                        <div style="width:40px;height:40px;border-radius:12px;background:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                            <span class="material-symbols-outlined" style="color:#fff; font-size:22px;">smart_toy</span>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div style="display:flex;justify-content:flex-end;margin-top:8px;padding-top:16px;border-top:1px solid var(--outline-variant);">
                        <form th:action="@{/admin/chatbot/hapus/{id}(id=${log.idLog})}" method="post"
                                th:onsubmit="handleConfirm(event, 'Hapus riwayat chat ini dari database?', 'delete')">
                            <button type="submit" class="btn btn-icon delete" title="Hapus Log" style="color: var(--error);">
                                <span class="material-symbols-outlined" style="font-size:20px;">delete_forever</span>
                            </button>
                        </form>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(listChatbotLog)}" class="card" style="text-align:center;padding:64px;border-radius:24px;border:1px dashed var(--outline-variant);">
                    <div style="width:80px;height:80px;background:var(--surface-container-low);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
                        <span class="material-symbols-outlined" style="font-size:40px;color:var(--outline);">cloud_off</span>
                    </div>
                    <h3 style="font-weight:700; color:var(--on-surface);">Belum ada riwayat chat</h3>
                    <p style="color:var(--outline);">Data log akan muncul setelah petani berinteraksi dengan AI.</p>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
function filterLog(){
    const p = document.getElementById('filterPetani').value.toLowerCase();
    const d = document.getElementById('filterDate').value;
    document.querySelectorAll('.chat-log-item').forEach(c => {
        const name = (c.querySelector('[data-petani]')?.textContent || '').toLowerCase();
        const isoDate = c.querySelector('[data-date-iso]')?.getAttribute('data-date-iso') || '';
        
        const matchP = !p || name.includes(p);
        const matchD = !d || isoDate === d;
        
        c.style.display = matchP && matchD ? 'flex' : 'none';
    });
}
function resetLogFilter(){
    document.getElementById('filterPetani').value = '';
    document.getElementById('filterDate').value = '';
    document.querySelectorAll('.chat-log-item').forEach(c => c.style.display = 'flex');
}
</script>
<div th:replace="~{admin/layout :: confirmModal}"></div>
</body>
</html>
