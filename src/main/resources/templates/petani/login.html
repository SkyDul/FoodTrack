<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login Petani — FoodTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: #1a5c2a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 400px;
            padding: 32px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            justify-content: center;
        }
        .brand-icon {
            width: 40px; height: 40px;
            background: #096430;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1e293b;
            letter-spacing: -0.5px;
            margin: 0;
        }
        .brand-name span { color: #096430; }
        
        .form-header { text-align: center; margin-bottom: 24px; }
        .form-header h1 { font-size: 1.125rem; font-weight: 700; color: #1e293b; margin: 0; }
        
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .form-control {
            width: 100%;
            height: 44px;
            padding: 0 16px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            font-size: 0.9375rem;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: #1a5c2a;
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26, 92, 42, 0.12);
        }
        
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.8125rem;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            cursor: pointer;
        }
        .forgot-pwd {
            color: #1a5c2a;
            font-weight: 600;
            text-decoration: none;
        }
        .forgot-pwd:hover { text-decoration: underline; }

        .btn-login {
            width: 100%;
            height: 48px;
            background: #1a5c2a;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.9375rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-login:hover { background: #2e7d32; transform: translateY(-1px); }
        
        .register-link {
            text-align: center;
            margin-top: 16px;
            font-size: 0.875rem;
            color: #64748b;
        }
        .register-link a {
            color: #1a5c2a;
            font-weight: 700;
            text-decoration: none;
        }

        .footer-links {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
            text-align: center;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #64748b;
            text-decoration: none;
            font-size: 0.8125rem;
            font-weight: 500;
        }
        .back-link:hover { color: #1a5c2a; }
        
        .flash-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(8px); transition: opacity 0.3s ease;
            animation: fadeInOverlay 0.3s ease;
        }
        .flash-popup {
            background: #fff; border-radius: 24px; padding: 0;
            width: 90%; max-width: 380px; overflow: hidden;
            box-shadow: 0 24px 64px rgba(0,0,0,0.2);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center;
            border: 1px solid #f1f5f9;
        }
        .flash-icon-box {
            width: 100%; padding: 40px 0 24px; display: flex; justify-content: center;
            background: #f8fafc; border-bottom: 1px solid #f1f5f9;
        }
        .flash-icon-box span { font-size: 72px; color: #1a5c2a; }
        .flash-content { padding: 32px; text-align: center; }
        .flash-content h3 { font-size: 1.5rem; font-weight: 800; color: #1e293b; margin-bottom: 8px; }
        .flash-content p { color: #64748b; font-size: 0.9375rem; line-height: 1.6; margin-bottom: 24px; }
        
        @keyframes fadeInOverlay { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { from { transform: scale(0.85) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
    </style>
</head>
<body>
    <div class="login-card">
        <!-- Flash Messages -->
        <div th:if="${successMessage != null or param.successMsg != null}" class="flash-overlay" onclick="this.remove()">
            <div class="flash-popup" onclick="event.stopPropagation()">
                <div class="flash-icon-box">
                    <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">check_circle</span>
                </div>
                <div class="flash-content">
                    <h3>Pendaftaran Berhasil!</h3>
                    <p th:text="${successMessage ?: param.successMsg}">Akun Anda kini aktif. Silakan login untuk mulai mengelola stok pangan.</p>
                    <button class="btn-login" style="height:48px;" onclick="this.closest('.flash-overlay').remove()">Mulai Sekarang</button>
                </div>
            </div>
        </div>

        <div class="brand">
            <span class="material-symbols-outlined" style="color:#ffb300; font-size:36px; font-variation-settings:'FILL' 1;">eco</span>
            <h1 class="brand-name" style="color:#1a5c2a; font-weight:800; font-size:1.75rem; letter-spacing:-0.5px; margin:0;">FoodTrack</h1>
        </div>

        <div class="form-header">
            <h1>Portal Petani</h1>
        </div>

        <div th:if="${param.errorMsg != null}" style="background:#fef2f2; color:#dc2626; padding:10px; border-radius:8px; font-size:0.8125rem; margin-bottom:16px; text-align:center; border:1px solid #fee2e2;">
            <span th:text="${param.errorMsg}">Username atau password salah.</span>
        </div>
        <div th:if="${param.error != null and param.errorMsg == null}" style="background:#fef2f2; color:#dc2626; padding:10px; border-radius:8px; font-size:0.8125rem; margin-bottom:16px; text-align:center; border:1px solid #fee2e2;">
            Username atau password salah.
        </div>

        <form th:action="@{/login-petani}" method="post">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="username Anda" required autofocus/>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div style="position:relative;">
                    <input type="password" name="password" id="loginPwd" class="form-control" placeholder="••••••••" required/>
                    <span class="material-symbols-outlined" onclick="togglePwd('loginPwd', this)" style="position:absolute; right:12px; top:12px; cursor:pointer; color:#64748b; font-size:20px;">visibility</span>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember-me"/> Ingat Saya
                </label>
                <a th:href="@{/lupa-password}" class="forgot-pwd">Lupa Password?</a>
            </div>

            <button type="submit" class="btn-login">Masuk Portal</button>
            <div class="register-link">
                Belum punya akun? <a th:href="@{/register-petani}">Daftar di sini</a>
            </div>
        </form>

        <div class="footer-links">
            <a th:href="@{/}" class="back-link">
                <span class="material-symbols-outlined" style="font-size:16px;">home</span>
                Beranda
            </a>
        </div>
    </div>
    <script>
        function togglePwd(id, icon) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const usernameInput = document.querySelector('input[name="username"]');
            const passwordInput = document.querySelector('input[name="password"]');
            const rememberCheckbox = document.querySelector('input[name="remember-me"]');
            
            if (localStorage.getItem('foodtrack_petani_remember') === 'true') {
                usernameInput.value = localStorage.getItem('foodtrack_petani_username') || '';
                passwordInput.value = localStorage.getItem('foodtrack_petani_password') || '';
                rememberCheckbox.checked = true;
            }

            document.querySelector('form').addEventListener('submit', () => {
                if (rememberCheckbox.checked) {
                    localStorage.setItem('foodtrack_petani_remember', 'true');
                    localStorage.setItem('foodtrack_petani_username', usernameInput.value);
                    localStorage.setItem('foodtrack_petani_password', passwordInput.value);
                } else {
                    localStorage.removeItem('foodtrack_petani_remember');
                    localStorage.removeItem('foodtrack_petani_username');
                    localStorage.removeItem('foodtrack_petani_password');
                }
            });
        });
    </script>
</body>
</html>
