<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — Portal Petani SiPangan</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        .petani-login-page { display:flex;justify-content:center;align-items:center;min-height:100vh;background:var(--surface-container-low);padding:20px; }
        .petani-login-card { background:#fff;border-radius:var(--radius-xl);box-shadow:0 8px 32px rgba(0,0,0,0.08);overflow:hidden;width:100%;max-width:440px; }
        .petani-login-banner { background:linear-gradient(135deg,#f5deb3,#daa520);padding:40px 32px 24px;text-align:center;position:relative; }
        .petani-login-banner::after { content:'🌾';font-size:64px;position:absolute;right:20px;top:16px;opacity:0.3; }
        .petani-login-body { padding:32px; }
    </style>
</head>
<body>
<div class="petani-login-page">
    <div class="petani-login-card">
        <!-- Banner -->
        <div class="petani-login-banner">
            <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=800&q=60&h=200&fit=crop"
                 alt="Sawah" style="width:100%;height:120px;object-fit:cover;border-radius:var(--radius-lg);margin-bottom:16px;"/>
        </div>

        <div class="petani-login-body">
            <div style="text-align:center;margin-bottom:24px;">
                <h1 style="font-size:1.75rem;font-weight:700;color:var(--primary);">SiPangan</h1>
                <p style="color:var(--on-surface-variant);">Portal Petani — Catat. Distribusi. Konsultasi.</p>
            </div>

            <!-- Error Alert -->
            <div th:if="${param.error}" class="alert alert-error">
                <span class="material-symbols-outlined">error</span>
                Username atau password salah. Coba lagi.
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
                <span class="material-symbols-outlined">check_circle</span>
                Anda telah berhasil keluar.
            </div>

            <form th:action="@{/login-petani}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-icon">
                        <span class="material-symbols-outlined">person</span>
                        <input type="text" id="username" name="username" class="form-control"
                               placeholder="Masukkan username Anda" required autofocus/>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-icon">
                        <span class="material-symbols-outlined">lock</span>
                        <input type="password" id="password" name="password" class="form-control"
                               placeholder="Masukkan password Anda" required/>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;text-transform:uppercase;letter-spacing:0.05em;">
                    Masuk ke Portal
                </button>
            </form>

            <p style="text-align:center;margin-top:16px;font-size:0.875rem;">
                <a href="#" style="color:var(--primary);">Lupa password atau butuh bantuan?</a>
            </p>
        </div>

        <div style="text-align:center;padding:16px;border-top:1px solid var(--outline-variant);font-size:0.8125rem;color:var(--outline);">
            © 2024 SiPangan — Dinas Pertanian
        </div>
    </div>
</div>
</body>
</html>
