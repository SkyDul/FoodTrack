<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{petani/layout :: head('Catat Stok')}"></head>
<body>
<div class="layout">
    <nav th:replace="~{petani/layout :: sidebar('catat')}"></nav>
    <div class="main-content">
        <header th:replace="~{petani/layout :: topbar('<a href=\'/petani/dashboard\' style=\'color:var(--primary);text-decoration:none;font-weight:500;\'>Dashboard</a> <span style=\'color:var(--outline);margin:0 4px;\'>&rsaquo;</span> <a href=\'/petani/stok\' style=\'color:var(--primary);text-decoration:none;font-weight:500;\'>Stok Pangan</a> <span style=\'color:var(--outline);margin:0 4px;\'>&rsaquo;</span> <span style=\'font-weight:600;color:var(--on-surface);\'>Form Stok</span>')}"></header>
        <div class="page-content">
            <div class="page-header" style="margin-bottom: 24px;">
                <h1 style="font-size: 1.5rem; font-weight: 700;">Catat Stok Panen</h1>
                <p style="font-size: 0.875rem;">Masukkan rincian hasil panen terbaru Anda untuk diperbarui di sistem inventaris.</p>
            </div>

            <div class="card" style="padding: 32px; border-radius: 20px;">
                <form th:action="@{/petani/stok/simpan}" method="post" th:object="${stokPangan}">

                    <!-- 1. Pilih Komoditas -->
                    <div class="form-group">
                        <label style="font-size:1.125rem;font-weight:600;margin-bottom:16px;display:block;">1. Pilih Komoditas</label>
                        <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));gap:16px;margin-top:8px;">
                            <div th:each="k : ${listKomoditas}">
                                <input type="radio" th:field="*{komoditas.idKomoditas}" th:value="${k.idKomoditas}"
                                       th:id="'kom_' + ${k.idKomoditas}" style="display:none;" class="komoditas-radio"
                                       th:data-satuan="${k.satuan}"/>
                                <label th:for="'kom_' + ${k.idKomoditas}"
                                       style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px;border:2px solid var(--outline-variant);border-radius:var(--radius-lg);cursor:pointer;transition:all 0.2s;text-align:center;"
                                       class="komoditas-label">
                                    <span th:if="${k.namaKomoditas.contains('Beras') or k.namaKomoditas.contains('Jagung') or k.namaKomoditas.contains('Kedelai') or k.namaKomoditas.contains('Cabai') or k.namaKomoditas.contains('Bawang')}"
                                          class="material-symbols-outlined" style="font-size:32px;color:var(--primary);"
                                          th:text="${k.namaKomoditas.contains('Beras') ? 'grain' : 
                                                    k.namaKomoditas.contains('Jagung') ? 'agriculture' : 
                                                    k.namaKomoditas.contains('Kedelai') ? 'spa' : 
                                                    k.namaKomoditas.contains('Cabai') ? 'nutrition' : 
                                                    k.namaKomoditas.contains('Bawang') ? 'circles' : 'category'}"></span>
                                    <img th:unless="${k.namaKomoditas.contains('Beras') or k.namaKomoditas.contains('Jagung') or k.namaKomoditas.contains('Kedelai') or k.namaKomoditas.contains('Cabai') or k.namaKomoditas.contains('Bawang')}"
                                         th:src="@{/img/logo.png}" alt="FoodTrack" style="width:32px; height:32px; object-fit:contain;" />
                                    <span th:text="${k.namaKomoditas}" style="font-size:0.875rem;font-weight:600;color:var(--on-surface);">Beras</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- 2 & 3. Jumlah & Tanggal (Side by Side on Desktop) -->
                    <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));gap:24px;margin-top:32px;">
                        <div class="form-group">
                            <label style="font-size:1.125rem;font-weight:600;display:block;margin-bottom:8px;">2. Jumlah Panen</label>
                            <div style="display:flex; align-items:center; border: 1px solid var(--outline-variant); border-radius: var(--radius-md); overflow:hidden; transition:border-color 0.3s ease;">
                                <input type="number" th:field="*{jumlahMasuk}" class="form-control" placeholder="0"
                                       min="0" required style="height:48px; border:none; border-radius:0; flex:1; box-shadow:none;" id="inputJumlah"/>
                                <div style="padding:0 16px; background:var(--surface-container-high); color:var(--on-surface-variant); font-weight:700; display:flex; align-items:center; height:48px; border-left:1px solid var(--outline-variant);" id="satuanText">
                                    -
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label style="font-size:1.125rem;font-weight:600;display:block;margin-bottom:8px;">3. Tanggal Panen</label>
                            <div class="input-icon">
                                <span class="material-symbols-outlined">calendar_today</span>
                                <input type="date" th:field="*{tanggalPanen}" class="form-control" required style="height:48px;"/>
                            </div>
                        </div>
                    </div>

                    <div style="border-top:1px solid var(--outline-variant);padding-top:24px;margin-top:24px;">
                        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:14px;">
                            <span class="material-symbols-outlined" style="font-size:20px;">save</span> Simpan Stok Panen
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<style>
    .komoditas-radio:checked + .komoditas-label {
        border-color: var(--primary) !important;
        background: #e8f5e9;
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const radios = document.querySelectorAll('.komoditas-radio');
        const satuanText = document.getElementById('satuanText');

        function updateSatuan() {
            const selected = document.querySelector('.komoditas-radio:checked');
            if (selected) {
                const satuan = selected.getAttribute('data-satuan');
                satuanText.textContent = satuan ? satuan : '-';
            } else {
                satuanText.textContent = '-';
            }
        }

        radios.forEach(radio => {
            radio.addEventListener('change', updateSatuan);
        });

        // Panggil saat load untuk set awal jika ada data
        updateSatuan();
    });
</script>
</body>
</html>
