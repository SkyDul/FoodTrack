<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{petani/layout :: head('Catat Stok')}"></head>
<body>
<div class="layout">
    <nav th:replace="~{petani/layout :: sidebar('catat')}"></nav>
    <div class="main-content">
        <header th:replace="~{petani/layout :: topbar}"></header>
        <div class="page-content">
            <div class="page-header">
                <h1>Catat Stok Panen</h1>
                <p>Masukkan rincian hasil panen terbaru Anda untuk diperbarui di sistem inventaris.</p>
            </div>

            <div class="card" style="max-width:700px;">
                <form th:action="@{/petani/stok/simpan}" method="post" th:object="${stokPangan}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <!-- 1. Pilih Komoditas -->
                    <div class="form-group">
                        <label style="font-size:1.125rem;font-weight:600;margin-bottom:12px;">1. Pilih Komoditas</label>
                        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:8px;">
                            <div th:each="k : ${listKomoditas}">
                                <input type="radio" th:field="*{komoditas.idKomoditas}" th:value="${k.idKomoditas}"
                                       th:id="'kom_' + ${k.idKomoditas}" style="display:none;" class="komoditas-radio"/>
                                <label th:for="'kom_' + ${k.idKomoditas}"
                                       style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px;border:2px solid var(--outline-variant);border-radius:var(--radius-lg);cursor:pointer;transition:all 0.2s;text-align:center;"
                                       class="komoditas-label">
                                    <span class="material-symbols-outlined" style="font-size:28px;color:var(--primary);">eco</span>
                                    <span th:text="${k.namaKomoditas}" style="font-size:0.875rem;font-weight:500;">Beras</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- 2. Jumlah Panen -->
                    <div class="form-group">
                        <label style="font-size:1.125rem;font-weight:600;">2. Jumlah Panen</label>
                        <div style="display:flex;gap:12px;align-items:center;margin-top:8px;">
                            <input type="number" th:field="*{jumlahMasuk}" class="form-control" placeholder="0"
                                   min="0" required style="flex:1;"/>
                        </div>
                    </div>

                    <!-- 3. Tanggal Panen -->
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
                        <div class="form-group">
                            <label style="font-size:1.125rem;font-weight:600;">3. Tanggal Panen</label>
                            <div class="input-icon" style="margin-top:8px;">
                                <span class="material-symbols-outlined">calendar_today</span>
                                <input type="date" th:field="*{tanggalPanen}" class="form-control" required/>
                            </div>
                        </div>
                    </div>

                    <div style="border-top:1px solid var(--outline-variant);padding-top:24px;margin-top:24px;">
                        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:14px;">
                            <span class="material-symbols-outlined" style="font-size:20px;">save</span> Simpan Stok Panen
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<style>
    .komoditas-radio:checked + .komoditas-label {
        border-color: var(--primary) !important;
        background: #e8f5e9;
    }
</style>
</body>
</html>
