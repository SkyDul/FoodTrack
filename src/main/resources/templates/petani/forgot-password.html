<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Lupa Password — FoodTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: #1a5c2a;
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1.5px, transparent 1.5px);
            background-size: 40px 40px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 400px;
            padding: 32px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            justify-content: center;
        }
        .brand-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1e293b;
            letter-spacing: -0.5px;
            margin: 0;
        }
        
        .form-header { text-align: center; margin-bottom: 24px; }
        .form-header h1 { font-size: 1.125rem; font-weight: 700; color: #1e293b; margin: 0; }
        .form-header p { font-size: 0.875rem; color: #64748b; margin-top: 8px; }
        
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .form-control {
            width: 100%;
            height: 44px;
            padding: 0 16px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            font-size: 0.9375rem;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: #1a5c2a;
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26, 92, 42, 0.12);
        }

        .btn-login {
            width: 100%;
            height: 48px;
            background: #1a5c2a;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.9375rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }
        .btn-login:hover { background: #2e7d32; transform: translateY(-1px); }

        .footer-links {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
            text-align: center;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #64748b;
            text-decoration: none;
            font-size: 0.8125rem;
            font-weight: 500;
        }
        .back-link:hover { color: #1a5c2a; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <span class="material-symbols-outlined" style="color:#ffb300; font-size:36px; font-variation-settings:'FILL' 1;">eco</span>
            <h1 class="brand-name" style="color:#1a5c2a; font-weight:800; font-size:1.75rem; letter-spacing:-0.5px; margin:0;">FoodTrack</h1>
        </div>

        <div class="form-header">
            <h1>Reset Password</h1>
            <p>Masukkan username dan nomor kontak yang terdaftar untuk mengatur ulang password Anda.</p>
        </div>

        <div th:if="${errorMessage != null}" style="background:#fef2f2; color:#dc2626; padding:10px; border-radius:8px; font-size:0.8125rem; margin-bottom:16px; text-align:center; border:1px solid #fee2e2;">
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/lupa-password}" method="post">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="username Anda" required autofocus/>
            </div>
            
            <div class="form-group">
                <label class="form-label">Nomor Kontak</label>
                <input type="text" name="kontak" class="form-control" placeholder="Contoh: 08123456789" required/>
            </div>

            <div class="form-group">
                <label class="form-label">Password Baru</label>
                <div style="position:relative;">
                    <input type="password" name="newPassword" id="newPwd" class="form-control" placeholder="••••••••" required/>
                    <span class="material-symbols-outlined" onclick="togglePwd('newPwd', this)" style="position:absolute; right:12px; top:12px; cursor:pointer; color:#64748b; font-size:20px;">visibility</span>
                </div>
            </div>

            <button type="submit" class="btn-login">Simpan Password Baru</button>
        </form>

        <div class="footer-links">
            <a th:href="@{/login-petani}" class="back-link">
                <span class="material-symbols-outlined" style="font-size:16px;">arrow_back</span>
                Kembali ke Login
            </a>
        </div>
    </div>
    
    <script>
        function togglePwd(id, icon) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }
    </script>
</body>
</html>
