<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{petani/layout :: head('Riwayat Distribusi')}"></head>
<body>
<div class="layout">
    <nav th:replace="~{petani/layout :: sidebar('distribusi')}"></nav>
    <div class="main-content">
        <header th:replace="~{petani/layout :: topbar('<a href=\'/petani/dashboard\' style=\'color:var(--primary);text-decoration:none;font-weight:500;\'>Dashboard</a> <span style=\'color:var(--outline);margin:0 4px;\'>&rsaquo;</span> <span style=\'font-weight:600;color:var(--on-surface);\'>Riwayat Distribusi</span>')}"></header>
        <div class="page-content">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;">
                <div>
                    <h1 style="font-size:1.25rem;font-weight:700;">Riwayat Distribusi Saya</h1>
                    <p style="font-size:0.875rem; color:var(--on-surface-variant);">Pantau pergerakan dan status pengiriman komoditas Anda.</p>
                </div>
            </div>

            <!-- Summary Banner -->
            <div style="background: linear-gradient(135deg, #096430, #148f47); color: #fff; border-radius: 20px; padding: 24px; margin-bottom: 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; box-shadow: 0 10px 30px rgba(9, 100, 48, 0.15);">
                <div style="text-align: center;">
                    <div style="font-size: 0.625rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; margin-bottom: 4px;">TOTAL KIRIM</div>
                    <div style="font-size: 1.75rem; font-weight: 700;" th:text="${totalDistribusi} ?: '0'">1,284</div>
                </div>
                <div style="text-align: center; border-left: 1px solid rgba(255, 255, 255, 0.2);">
                    <div style="font-size: 0.625rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; margin-bottom: 4px;">BERHASIL</div>
                    <div style="font-size: 1.75rem; font-weight: 700;" th:text="${totalSelesai} ?: '0'">420</div>
                </div>
                <div style="text-align: center; border-left: 1px solid rgba(255, 255, 255, 0.2);">
                    <div style="font-size: 0.625rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; margin-bottom: 4px;">PROSES</div>
                    <div style="font-size: 1.75rem; font-weight: 700;" th:text="${totalProses} ?: '0'">56</div>
                </div>
            </div>

            <!-- Filter Tabs -->
            <div style="margin-bottom: 24px;">
                <div class="filter-tabs-container">
                    <button class="filter-tab active-tab" onclick="filterStatus(this,'')">Semua</button>
                    <button class="filter-tab" onclick="filterStatus(this,'Menunggu')">Menunggu</button>
                    <button class="filter-tab" onclick="filterStatus(this,'Dikirim')">Dikirim</button>
                    <button class="filter-tab" onclick="filterStatus(this,'Selesai')">Selesai</button>
                </div>
            </div>

            <style>
                .filter-tabs-container {
                    display: inline-flex; gap: 4px; background: #f1f5f9; padding: 6px; border-radius: 14px; border: 1px solid #e2e8f0;
                }
                .filter-tab {
                    border-radius: 10px; padding: 8px 24px; border: none; background: transparent; 
                    font-size: 0.875rem; font-weight: 600; color: #64748b; cursor: pointer; transition: all 0.3s ease;
                    outline: none;
                }
                .filter-tab:hover { color: #1a5c2a; background: rgba(255,255,255,0.6); }
                .filter-tab.active-tab {
                    background: #fff !important; color: #1a5c2a !important; 
                    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
                }
            </style>

            <!-- Table -->
            <div class="card">
                <div class="table-container">
                    <table id="distTable">
                        <thead>
                        <tr>
                            <th>Komoditas</th>
                            <th>Tanggal Kirim</th>
                            <th>Tujuan</th>
                            <th>Jumlah</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="d : ${listDistribusi}" th:data-status="${d.statusPengiriman}">
                            <td>
                                <div>
                                    <strong th:text="${d.stokPangan.komoditas.namaKomoditas}">Beras IR64 Premium</strong>
                                </div>
                            </td>
                            <td th:text="${d.tanggalKirim != null ? #temporals.format(d.tanggalKirim, 'dd MMM yyyy') : '—'}">12 Okt 2023</td>
                            <td>
                                <span style="display:flex;align-items:center;gap:6px;">
                                    <span class="material-symbols-outlined" style="font-size:18px;color:var(--outline);">warehouse</span>
                                    <span th:text="${d.tujuan}">Gudang Bulog</span>
                                </span>
                            </td>
                            <td><strong th:text="${d.stokPangan.jumlahMasuk + ' ' + d.stokPangan.komoditas.satuan}">15.5 Ton</strong></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${d.statusPengiriman == 'Selesai'} ? 'badge-green' : (${d.statusPengiriman == 'Dikirim'} ? 'badge-blue' : 'badge-yellow')">
                                    <span class="material-symbols-outlined" 
                                          th:text="${d.statusPengiriman == 'Selesai'} ? 'check_circle' : (${d.statusPengiriman == 'Dikirim'} ? 'local_shipping' : 'schedule')">schedule</span>
                                    <span th:text="${d.statusPengiriman}">Selesai</span>
                                </span>
                            </td>
                        </tr>

                        <!-- Unified Empty State -->
                        <tr id="emptyRow" th:style="${#lists.isEmpty(listDistribusi)} ? '' : 'display:none;'">
                            <td colspan="5" style="text-align:center;color:var(--outline);padding:48px;">
                                <span class="material-symbols-outlined" style="font-size:48px;margin-bottom:8px;display:block;">local_shipping</span>
                                <span id="emptyText">Belum ada riwayat distribusi</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
function filterStatus(btn, status){
    document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active-tab'));
    btn.classList.add('active-tab');
    
    const rows = document.querySelectorAll('#distTable tbody tr:not(#emptyRow)');
    let visibleCount = 0;
    
    rows.forEach(r => {
        const isMatch = !status || r.dataset.status === status;
        r.style.display = isMatch ? '' : 'none';
        if (isMatch) visibleCount++;
    });

    const emptyRow = document.getElementById('emptyRow');
    const emptyText = document.getElementById('emptyText');
    if (emptyRow) {
        emptyRow.style.display = (visibleCount === 0) ? '' : 'none';
        if (emptyText) {
            emptyText.innerText = 'Belum ada riwayat distribusi';
        }
    }
}
</script>
</body>
</html>
